name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    env:
      # Set this in GitHub: Settings > Secrets and variables > Actions > Variables > BACKEND_URL (e.g. https://dreamgift.onrender.com)
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      # Debug APK installs directly on any phone. It talks to BACKEND_URL (or the emulator's localhost if unset).
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode upload keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # Needs BACKEND_URL (https) + the 4 signing secrets. The build fails loudly if the URL is missing.
      - name: Build signed release (AAB for Play + APK)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DreamGift-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        with:
          name: DreamGift-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_B64 != '' }}
        with:
          name: DreamGift-release-apk
          path: app/build/outputs/apk/release/*.apk
